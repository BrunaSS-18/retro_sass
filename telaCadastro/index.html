<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <header>
           <img src="../imagens/logo.png" class="logo" alt="logo">

            <nav>
                <a href="../telaHome/index.html">Inicio</a>
                <a href="../telaCatalogo/index.html">Catalogo</a>
                <a href="../telaFama/index.html">Pódio</a>
                <a href="#">cadastre-se</a>
            </nav>
        </header>

        <aside>
            <p class="fraseTopo">Cadastre - se<br>para receber novidades</p>
        </aside>

        <form>
            <div class="input-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Seu nome Completo...">
            </div>

            <div class="input-group">
                <label for="tel">Celular:</label>
                <input type="text" id="tel" placeholder="(00) 00000-0000">
            </div>

            <div class="input-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Digite um email...">
            </div>

            <button>Confirmar</button>
        </form>

        <div class="fantasminha">
            <img src="../imagens/fantasminha.png">
        </div>

        <footer>
            <p>2026 - GameOver Retro</p>
        </footer>
    </div>
    
</body>
</html>
